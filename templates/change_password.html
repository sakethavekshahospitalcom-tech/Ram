<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div style="text-align:center; margin-bottom:20px;">
        <img src="{{ url_for('static', filename='logo.jpeg') }}"
             alt="Ganesh Youth Force"
             style="width:110px; height:110px;
                    border-radius:50%; object-fit:cover;">
    </div>

    <h1>Change Password</h1>
    <p>Department: <b>{{ session.get("username") }}</b></p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if message %}
        <p style="color:green;">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/change-password">
        <p><input type="password" name="old_password" placeholder="Current password" required></p>
        <p><input type="password" name="new_password" placeholder="New password (min 8 characters)" required></p>
        <p><input type="password" name="confirm_password" placeholder="Confirm new password" required></p>
        <p><button type="submit">Change Password</button></p>
    </form>

    <p><a href="/tickets">Back to Tickets</a></p>
</body>
</html>
