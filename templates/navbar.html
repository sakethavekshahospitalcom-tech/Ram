<div style="text-align:center; margin-bottom:20px;">
    <a href="/">
        <img src="{{ url_for('static', filename='logo.jpeg') }}"
             alt="Ganesh Youth Force"
             style="width:110px; height:110px;
                    border-radius:50%; object-fit:cover;">
    </a>
    <div style="margin-top:10px;">
        <a href="/tickets/new" style="margin:0 10px;">Create Ticket</a>
        <a href="/tickets" style="margin:0 10px;">View Tickets</a>
        {% if session.get("user_id") %}
            <span style="margin:0 10px; color:#4a5568;">
                Hi, {{ session.get("username") }}
            </span>
            <a href="/logout" style="margin:0 10px;">Logout</a>
        {% else %}
            <a href="/login" style="margin:0 10px;">Login</a>
            <a href="/register" style="margin:0 10px;">Register</a>
        {% endif %}
    </div>
</div>
