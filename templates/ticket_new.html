<!DOCTYPE html>
<html>
<head>
    <title>New Ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .dept-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
            text-align: left;
            font-size: 15px;
            max-height: 190px;
            overflow-y: auto;
            padding: 8px 10px;
            border: 1px solid #cfdde6;
            border-radius: 8px;
            background: #ffffff;
        }
        .dept-grid label {
            color: #2b3a45;
            white-space: nowrap;
        }
        .dept-grid input {
            padding: 0;
            margin-right: 6px;
            width: auto;
        }
        .topright {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto 10px auto;
            flex-wrap: wrap;
        }
        .topright a {
            padding: 8px 14px;
            border: 1px solid #0a85bb;
            border-radius: 8px;
            background: #ffffff;
        }
        .topright a:hover {
            background: #0a85bb;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="topright">
        <a href="/tickets">View Tickets</a>
        <a href="/">Back to Home</a>
        <a href="/logout">Logout</a>
    </div>

    <div style="text-align:center; margin-bottom:20px;">
        <img src="{{ url_for('static', filename='logo.jpeg') }}"
             alt="Ganesh Youth Force">
    </div>

    <h1>Create a Ticket</h1>

    {% if saved %}
        <h2>Ticket saved!</h2>
    {% endif %}

    <form method="POST" action="/tickets/new" enctype="multipart/form-data">
        <p><input type="text" name="your_name" placeholder="Your name (who is raising this ticket)" required></p>
        <p><input type="text" name="title" placeholder="Ticket title" required></p>
        <p><textarea name="description" placeholder="Describe the problem" rows="5" cols="40" required></textarea></p>
        <p>
            <select name="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
        </p>
        <p><label>Send to department(s):</label></p>
        <div class="dept-grid">
            {% for d in departments %}
                <label><input type="checkbox" name="depts" value="{{ d }}">{{ d }}</label>
            {% endfor %}
        </div>
        <p>
            <label>📷 Take a photo (camera):</label><br>
            <input type="file" name="camera_image" accept="image/*" capture="environment">
        </p>
        <p>
            <label>🖼️ Or choose from gallery / files:</label><br>
            <input type="file" name="gallery_image" accept="image/*">
        </p>
        <p><button type="submit">Create Ticket</button></p>
    </form>
</body>
</html>
