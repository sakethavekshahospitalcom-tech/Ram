<!DOCTYPE html>
<html>
<head>
    <title>All Tickets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        table {
            margin: auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #cbd5e0;
            padding: 10px 16px;
            text-align: left;
        }
        th {
            background-color: #2b6cb0;
            color: white;
        }
    </style>
</head>
<body>
    <h1>All Tickets</h1>

    {% if rows %}
        <table>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Photo</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
            {% for t in rows %}
            <tr>
                <td>{{ t["id"] }}</td>
                <td>{{ t["title"] }}</td>
                <td>
                    {% if t["image"] %}
                        <a href="/uploads/{{ t['image'] }}" target="_blank">
                            <img src="/uploads/{{ t['image'] }}" alt="ticket photo" style="width:80px; height:80px; object-fit:cover; border-radius:6px;">
                        </a>
                    {% else %}
                        -
                    {% endif %}
                </td>
                <td>{{ t["priority"] }}</td>
                <td>
                    <form method="POST" action="/tickets/{{ t['id'] }}/status">
                        <select name="status">
                            <option value="Open" {% if t["status"] == "Open" %}selected{% endif %}>Open</option>
                            <option value="In Progress" {% if t["status"] == "In Progress" %}selected{% endif %}>In Progress</option>
                            <option value="Closed" {% if t["status"] == "Closed" %}selected{% endif %}>Closed</option>
                        </select>
                        <button type="submit">Update</button>
                    </form>
                </td>                <td>{{ t["created_at"] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No tickets yet.</p>
    {% endif %}

    <p><a href="/tickets/new">Create a new ticket</a></p>
    <p><a href="/">Back to Home</a></p>
    <script>
        var socket = io();
        socket.on("tickets_changed", function () {
            location.reload();
        });
    </script>
</body>
</html>
