<!DOCTYPE html>
<html>
<head>
    <title>Reset Passwords</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reset-table td form {
            display: flex;
            gap: 8px;
        }
        .reset-table input {
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div style="text-align:center; margin-bottom:20px;">
        <img src="{{ url_for('static', filename='logo.jpeg') }}"
             alt="Ganesh Youth Force"
             style="width:110px; height:110px;
                    border-radius:50%; object-fit:cover;">
    </div>

    <h1>Reset Department Passwords</h1>
    <p>Set a temporary password. The department should change it after login.</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if message %}
        <p style="color:green;">{{ message }}</p>
    {% endif %}

    <table class="reset-table">
        <tr>
            <th>Department</th>
            <th>New temporary password</th>
        </tr>
        {% for u in users %}
        <tr>
            <td>{{ u["username"] }}</td>
            <td>
                <form method="POST" action="/admin/passwords">
                    <input type="hidden" name="user_id" value="{{ u['id'] }}">
                    <input type="text" name="temp_password" placeholder="min 8 characters" required>
                    <button type="submit">Reset</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/tickets">Back to Tickets</a></p>
</body>
</html>
