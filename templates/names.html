<!DOCTYPE html>
<html>
<head>
    <title>Saved Names</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Saved Names</h1>

    {% if rows %}
        {% for row in rows %}
            <p>{{ row["id"] }}. {{ row["name"] }}</p>
        {% endfor %}
    {% else %}
        <p>No names saved yet.</p>
    {% endif %}

    <p><a href="/form">Add a name</a></p>
    <p><a href="/">Back to Home</a></p>
</body>
</html>
